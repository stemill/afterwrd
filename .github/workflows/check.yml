# Checks the Worker's code on every push and pull request: `npm run check` (type checks; see worker/tsconfig.json).
# It only reads the code, so it has no write access to anything.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      # Actions pinned to exact commits, as in release.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # No install scripts, as in release.yml: TypeScript and wrangler find their programs without them.
      - run: npm ci --ignore-scripts

      - run: npm run check
