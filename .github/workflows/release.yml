# Builds and publishes a heybert release when a version tag is pushed:
#
#   (bump "version" in worker/package.json and commit)
#   git tag -a v0.2.0 -m "heybert 0.2.0" && git push origin v0.2.0
#
# The release's files (manifest, files named by hash, installer.js) are built here from the tagged source and
# attached to a GitHub release, which is where installers download them from.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build the release
        run: npm run release -- --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/"$VERSION"/* \
            --title "heybert $VERSION" \
            --notes "To install, follow [Install your own](https://github.com/$GITHUB_REPOSITORY#install-your-own) and paste in installer.js from this release."
