# Builds and publishes a heybert release when a version tag is pushed:
#
#   (bump "version" in worker/package.json and commit)
#   git tag -a v0.2.0 -m "heybert 0.2.0" && git push origin v0.2.0
#
# The release's files (manifest, files named by hash, installer.js) are built here from the tagged source and
# attached to a GitHub release, which is where installers download them from.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build the release
        run: npm run release -- --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/"$VERSION"/* \
            --title "heybert $VERSION" \
            --notes "To install, follow the [install page](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/), which copies installer.js for you."

      # The install page, with this release's installer in it, goes to the gh-pages branch, which GitHub Pages
      # serves (Settings → Pages → Deploy from a branch → gh-pages). Only the latest page is kept.
      - name: Publish the install page
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: worker/release/site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Install page for heybert $VERSION"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
