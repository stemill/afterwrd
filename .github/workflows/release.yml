# Builds and publishes a afterwrd release when a version tag is pushed:
#
#   (bump "version" in worker/package.json and commit)
#   git tag -a v0.2.0 -m "afterwrd 0.2.0" && git push origin v0.2.0
#
# The release's files (manifest, files named by hash, installer.js) are built here from the tagged source and
# attached to a GitHub release, which is where installers download them from.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      # Actions pinned to exact commits, so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # don't leave a write token on disk while dependencies install

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build the release
        run: npm run release -- --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/"$VERSION"/* \
            --title "afterwrd $VERSION" \
            --notes "To install, follow the [install page](https://$(node -p "require('./package.json').afterwrd.site")/), which copies installer.js for you."

      # The install page, with this release's installer in it, goes to the gh-pages branch, which GitHub Pages
      # serves (Settings → Pages → Deploy from a branch → gh-pages) at the domain in package.json (afterwrd.site).
      # Only the latest page is kept.
      - name: Publish the install page
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: worker/release/site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Install page for afterwrd $VERSION"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
