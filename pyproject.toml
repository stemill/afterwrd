[project]
name = "afterwrd"
version = "0.1.0"
description = "Browse a Facebook data export: friends, posts, photos, comments and likes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pillow>=11",
    "uvicorn>=0.32",
]

[project.scripts]
afterwrd = "afterwrd.app:main"
afterwrd-ingest = "afterwrd.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
